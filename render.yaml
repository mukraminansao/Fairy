services:
  - type: web
    name: fairy-demo
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start:host
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
